# ─── Servidor ─────────────────────────────────────────────────────────────────
server.port=8080

# ─── Fuente de Datos: H2 en Memoria ──────────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:commercedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ─── Consola H2 (solo demo/desarrollo — no usar en producción) ────────────────
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ─── JPA / Hibernate ──────────────────────────────────────────────────────────
# create-drop: crea el esquema al arrancar y lo elimina al apagar.
# Hibernate 6 auto-detecta el dialecto H2; no se necesita declararlo explícitamente.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# ─── Inicialización de Datos ──────────────────────────────────────────────────
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.jpa.defer-datasource-initialization=true

# ─── API Externa ──────────────────────────────────────────────────────────────
external.api.categories.base-url=https://api.escuelajs.co/api/v1

# ─── Swagger UI / OpenAPI ─────────────────────────────────────────────────────
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ─── Paginación ───────────────────────────────────────────────────────────────
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.default-page-size=20

# ─── Logging ──────────────────────────────────────────────────────────────────
logging.level.com.commerce.api=INFO
logging.level.org.hibernate.orm.jdbc.bind=INFO
logging.level.org.hibernate.tool.schema=WARN
