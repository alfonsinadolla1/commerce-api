# ─── Servidor ─────────────────────────────────────────────────────────────────
server.port=8080

# ─── Fuente de Datos: H2 en Memoria ──────────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:commercedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ─── Consola H2 ──────────────────────────────────────────────────────────────
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ─── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ─── Inicialización de Datos ──────────────────────────────────────────────────
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# ─── API Externa ──────────────────────────────────────────────────────────────
external.api.categories.base-url=https://api.escuelajs.co/api/v1

# ─── Swagger UI / OpenAPI ─────────────────────────────────────────────────────
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ─── Logging ──────────────────────────────────────────────────────────────────
logging.level.com.commerce.api=INFO
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.hibernate.tool.schema=WARN
